name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui macos

      - name: Resolve version from tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build library
        run: |
          VERSION_ARG=""
          if [ -n "$PACKAGE_VERSION" ]; then
            VERSION_ARG="-p:PackageVersion=$PACKAGE_VERSION"
          fi
          dotnet build src/Plugin.Maui.SquircleContainer/Plugin.Maui.SquircleContainer.csproj -c Release $VERSION_ARG

      - name: Pack NuGet
        run: |
          VERSION_ARG=""
          if [ -n "$PACKAGE_VERSION" ]; then
            VERSION_ARG="-p:PackageVersion=$PACKAGE_VERSION"
          fi
          dotnet pack src/Plugin.Maui.SquircleContainer/Plugin.Maui.SquircleContainer.csproj -c Release --no-build -o ./artifacts $VERSION_ARG

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./artifacts/*.nupkg

      - name: NuGet login (OIDC trusted publishing)
        if: github.event_name == 'release'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: github.event_name == 'release'
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
